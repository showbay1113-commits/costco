<style>
:root {
  --red: #c0392b;
  --red2: #e74c3c;
  --gold: #f39c12;
  --gold2: #f1c40f;
  --navy: #1a237e;
  --navy2: #283593;
  --bg: #f7f5f2;
  --card: #fff;
  --border: rgba(0,0,0,0.08);
  --text: #1c1c1e;
  --muted: #8e8e93;
  --green: #27ae60;
  --orange: #e67e22;
  --shadow: 0 2px 12px rgba(0,0,0,0.07);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans TC',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}

/* HEADER */
.header{background:linear-gradient(160deg,#b71c1c 0%,#c62828 40%,#1a237e 100%);color:#fff;padding:28px 20px 22px;position:relative;overflow:hidden}
.header::after{content:'COSTCO';font-family:'Bebas Neue',sans-serif;font-size:220px;position:absolute;right:-20px;top:-40px;opacity:0.04;letter-spacing:-5px;pointer-events:none}
.h-top{position:relative;z-index:1}
.h-title{font-family:'Bebas Neue',sans-serif;font-size:clamp(32px,7vw,58px);letter-spacing:3px;line-height:1}
.h-title em{color:var(--gold2);font-style:normal}
.h-sub{font-size:13px;opacity:0.8;margin-top:6px;letter-spacing:1px}
.h-stats{display:flex;gap:12px;margin-top:18px;flex-wrap:wrap;position:relative;z-index:1}
.h-stat{background:rgba(255,255,255,0.12);border:1px solid rgba(255,255,255,0.2);border-radius:10px;padding:8px 16px;text-align:center;min-width:80px}
.h-stat-n{font-size:22px;font-weight:900;color:var(--gold2);line-height:1}
.h-stat-l{font-size:11px;opacity:0.8;margin-top:2px}

/* AI BANNER */
.ai-banner{background:var(--navy);color:#fff;padding:10px 20px;display:flex;align-items:center;gap:10px;font-size:13px}
.ai-dot{width:8px;height:8px;border-radius:50%;background:#4caf50;animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.3}}
#ai-status{flex:1}
.progress-bar{height:3px;background:rgba(255,255,255,0.2);margin-top:6px;border-radius:2px;overflow:hidden;display:none}
.progress-fill{height:100%;background:var(--gold2);border-radius:2px;transition:width 0.3s;width:0%}

/* FILTERS */
.filters{background:#fff;border-bottom:1px solid var(--border);padding:10px 16px;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;sticky;top:0;z-index:100;position:sticky}
.filters::-webkit-scrollbar{display:none}
.filter-btn{background:none;border:1.5px solid var(--border);color:var(--muted);font-family:'Noto Sans TC',sans-serif;font-size:12px;padding:5px 12px;border-radius:20px;cursor:pointer;white-space:nowrap;transition:all 0.2s}
.filter-btn.active,.filter-btn:hover{border-color:var(--red);color:var(--red);background:#fef0f0}

/* SECTION */
.section-wrap{max-width:1100px;margin:0 auto;padding:0 12px}
.section-head{display:flex;align-items:center;gap:10px;padding:20px 0 10px;border-bottom:2px solid var(--navy);margin-bottom:14px}
.section-head-title{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:1px;color:var(--navy)}
.deadline-tag{background:var(--red);color:#fff;font-size:10px;padding:2px 8px;border-radius:12px;font-weight:700}
.count-tag{background:#f0f0f5;color:var(--muted);font-size:11px;padding:2px 8px;border-radius:12px}

/* GRID */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;margin-bottom:28px}

/* CARD */
.card{background:var(--card);border-radius:14px;overflow:hidden;box-shadow:var(--shadow);border:1px solid var(--border);transition:transform 0.2s,box-shadow 0.2s;position:relative}
.card:hover{transform:translateY(-3px);box-shadow:0 8px 28px rgba(0,0,0,0.12)}
.card.hidden-deal::before{content:'🔍 隱藏';position:absolute;top:8px;left:8px;background:var(--navy);color:#fff;font-size:9px;padding:2px 7px;border-radius:5px;font-weight:700;z-index:2}

/* IMAGE AREA */
.card-img{position:relative;aspect-ratio:4/3;background:#f0ede8;overflow:hidden}
.card-img img{width:100%;height:100%;object-fit:cover;display:block;transition:transform 0.3s}
.card:hover .card-img img{transform:scale(1.05)}
.card-img .placeholder{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:40px;color:#ddd}
.freq-pill{position:absolute;top:8px;right:8px;font-size:9px;font-weight:700;padding:2px 7px;border-radius:10px;color:#fff;letter-spacing:0.3px}
.freq-pill.high{background:#e74c3c}
.freq-pill.mid{background:#e67e22}
.freq-pill.low{background:#27ae60}

/* PRICE BOX */
.price-box{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(to top,rgba(0,0,0,0.75) 0%,transparent 100%);padding:6px 8px 7px;min-height:36px}
.price-loading{color:rgba(255,255,255,0.6);font-size:10px;display:flex;align-items:center;gap:4px}
.price-spinner{width:10px;height:10px;border:1.5px solid rgba(255,255,255,0.3);border-top-color:#fff;border-radius:50%;animation:spin 0.8s linear infinite;flex-shrink:0}
@keyframes spin{to{transform:rotate(360deg)}}
.price-data{color:#fff}
.price-orig{font-size:11px;opacity:0.75;text-decoration:line-through}
.price-discount{font-size:11px;opacity:0.8;color:var(--gold2)}
.price-final{font-size:16px;font-weight:900;color:var(--gold2)}
.price-formula{font-size:10px;opacity:0.8;color:rgba(255,255,255,0.85)}
.price-na{color:rgba(255,255,255,0.5);font-size:10px}

/* BODY */
.card-body{padding:9px 11px 12px}
.card-cat{font-size:10px;color:var(--muted);margin-bottom:4px}
.card-name{font-size:12px;font-weight:700;line-height:1.4;color:var(--text)}
.card-sku{font-size:10px;color:#bbb;margin-top:2px}

/* LEGEND */
.legend{max-width:1100px;margin:14px auto 4px;padding:0 12px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.leg-item{display:flex;align-items:center;gap:5px}
.leg-dot{width:8px;height:8px;border-radius:50%}

/* FOOTER */
footer{background:var(--navy);color:rgba(255,255,255,0.5);text-align:center;padding:20px;font-size:11px;margin-top:30px}
footer strong{color:#fff}

@media(max-width:480px){
  .grid{grid-template-columns:repeat(2,1fr);gap:8px}
  .h-stats{gap:8px}
  .h-stat{min-width:70px;padding:6px 10px}
}
</style>
</head>

const catEmoji = {food:'🍱',health:'💊',home:'🏠',clothing:'👕',daily:'🧴'};
const catLabel = {food:'食品飲料',health:'健康保養',home:'家電3C',clothing:'服飾寢具',daily:'生活雜貨'};

let priceCache = {};
let pricedCount = 0;

function buildUI(filter) {
  const container = document.getElementById('main-container');
  container.innerHTML = '';
  const filtered = PRODUCTS.filter(p => {
    if(filter === 'all') return true;
    if(filter === 'hidden') return p.hidden;
    if(filter === 'low') return p.freq === 'low';
    return p.cat === filter;
  });

  document.getElementById('stat-total').textContent = filtered.length;

  const groups = {};
  filtered.forEach(p => {
    const key = p.hidden ? '隱藏優惠（05/08截止）' : '第1波特價（05/11截止）';
    if(!groups[key]) groups[key] = [];
    groups[key].push(p);
  });

  Object.keys(groups).sort().forEach(gk => {
    const items = groups[gk];
    const wrap = document.createElement('div');
    wrap.className = 'section-wrap';
    const deadline = gk.includes('05/08') ? '05/08' : '05/11';
    const now = new Date(2026,4,2);
    const end = new Date(2026,4,parseInt(deadline.split('/')[1]));
    const days = Math.ceil((end-now)/86400000);
    wrap.innerHTML = `
      <div class="section-head">
        <div class="section-head-title">${gk}</div>
        <span class="deadline-tag">⏰ 剩 ${days} 天</span>
        <span class="count-tag">${items.length} 件</span>
      </div>
    `;
    const grid = document.createElement('div');
    grid.className = 'grid';
    items.forEach(p => {
      const card = document.createElement('div');
      card.className = 'card' + (p.hidden ? ' hidden-deal' : '');
      card.dataset.sku = p.sku;
      const imgHtml = p.img
        ? `<img src="${p.img}" alt="${p.name}" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">`
        : '';
      const placeholderStyle = p.img ? 'display:none' : '';
      const cachedPrice = priceCache[p.sku];
      const priceHtml = cachedPrice ? renderPrice(cachedPrice) : `<div class="price-loading"><span class="price-spinner"></span><span>AI 識別中...</span></div>`;
      card.innerHTML = `
        <div class="card-img">
          ${imgHtml}
          <div class="placeholder" style="${placeholderStyle}">${catEmoji[p.cat]||'📦'}</div>
          <span class="freq-pill ${p.freq}">${p.freq==='high'?'高頻':p.freq==='mid'?'中頻':'低頻'}</span>
          <div class="price-box" id="pb-${p.sku.replace(/[^a-z0-9]/gi,'_')}">${priceHtml}</div>
        </div>
        <div class="card-body">
          <div class="card-cat">${catEmoji[p.cat]||''} ${catLabel[p.cat]||''}</div>
          <div class="card-name">${p.name}</div>
          <div class="card-sku">${p.sku}</div>
        </div>
      `;
      grid.appendChild(card);
    });
    wrap.appendChild(grid);
    container.appendChild(wrap);
  });
}

function renderPrice(data) {
  if(!data || data.error) return `<div class="price-na">無法識別價格</div>`;
  let html = '<div class="price-data">';
  if(data.orig && data.discount) {
    html += `<div class="price-orig">原價 $${data.orig}</div>`;
    html += `<div class="price-discount">折扣 -$${data.discount}</div>`;
    const final = data.orig - data.discount;
    html += `<div class="price-final">$${final}</div>`;
    html += `<div class="price-formula">${data.orig} - ${data.discount} = ${final}</div>`;
  } else if(data.sale) {
    html += `<div class="price-final">$${data.sale}</div>`;
    if(data.formula) html += `<div class="price-formula">${data.formula}</div>`;
  } else {
    html += `<div class="price-na">價格見現場</div>`;
  }
  html += '</div>';
  return html;
}

function updatePriceBox(sku, data) {
  const id = 'pb-' + sku.replace(/[^a-z0-9]/gi,'_');
  const el = document.getElementById(id);
  if(el) el.innerHTML = renderPrice(data);
}

async function fetchPriceForProduct(product) {
  if(!product.img) {
    priceCache[product.sku] = {error:true};
    return;
  }
  try {
    const prompt = `你是一個好市多商品價格識別助手。請查看這張好市多商品特價照片，找出價格標籤資訊。
商品名稱：${product.name} ${product.sku}

請只回傳 JSON 格式（不要任何其他文字）：
{"orig": 原價數字, "discount": 折扣金額數字, "sale": 特價數字, "formula": "原價-折扣=特價的公式字串"}

例如：{"orig": 580, "discount": 70, "sale": 510, "formula": "580-70=510"}

如果看不到清楚的價格標籤，回傳：{"error": true}
只回傳 JSON，不要任何解釋文字。`;

    const resp = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 200,
        messages: [{
          role: 'user',
          content: [
            {type:'image', source:{type:'url', url: product.img}},
            {type:'text', text: prompt}
          ]
        }]
      })
    });
    const data = await resp.json();
    const text = (data.content||[]).map(b=>b.text||'').join('').trim();
    const clean = text.replace(/```json|```/g,'').trim();
    const parsed = JSON.parse(clean);
    priceCache[product.sku] = parsed;
    pricedCount++;
    document.getElementById('stat-priced').textContent = pricedCount;
    updatePriceBox(product.sku, parsed);
  } catch(e) {
    priceCache[product.sku] = {error:true};
    updatePriceBox(product.sku, {error:true});
  }
}

async function startAIPricing() {
  const statusEl = document.getElementById('ai-status');
  const progBar = document.getElementById('prog-bar');
  const progFill = document.getElementById('prog-fill');
  const aiDot = document.getElementById('ai-dot');
  progBar.style.display = 'block';
  
  const hasImg = PRODUCTS.filter(p => p.img);
  const total = hasImg.length;
  let done = 0;

  const BATCH = 4;
  for(let i=0; i<hasImg.length; i+=BATCH) {
    const batch = hasImg.slice(i, i+BATCH);
    statusEl.textContent = `🤖 AI 正在分析第 ${i+1}~${Math.min(i+BATCH,total)}/${total} 件商品的價格標籤...`;
    await Promise.all(batch.map(p => fetchPriceForProduct(p)));
    done += batch.length;
    progFill.style.width = Math.round(done/total*100) + '%';
  }

  aiDot.style.background = '#4caf50';
  aiDot.style.animation = 'none';
  statusEl.textContent = `✅ AI 完成！已識別 ${pricedCount}/${total} 件商品價格`;
}

document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    buildUI(btn.dataset.f);
  });
});

buildUI('all');
startAIPricing();
